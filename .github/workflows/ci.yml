# NEMO Sports — CI (verification only).
# Runs the offline test suites, the production build, and the HTTP smoke test
# against a local production server. It uses NO secrets, makes NO deployment,
# and never touches a database or a live data provider.
name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · tests · build · smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Empty-data configuration for EVERY step. The build prerenders pages:
      # with the keyless SportScore provider enabled, a runner with internet
      # access bakes real provider data into static HTML during `next build`,
      # and `next start` then serves that data. Pin it for the whole job.
      NEMO_SPORTSCORE_ENABLED: "0"
    defaults:
      run:
        working-directory: nemo-sports
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: nemo-sports/package-lock.json

      - name: Install (lockfile)
        run: npm ci

      - name: Check (typecheck + offline suites, no server, no network)
        run: npm run check

      - name: Build
        run: npm run build

      - name: Diagnostics (names and presence only, no values)
        run: |
          echo "::notice title=diag::date(UTC)=$(date -u +%F_%T) tz=${TZ:-unset} node=$(node -v) NODE_ENV=${NODE_ENV:-unset}"
          for v in CI GITHUB_ACTIONS NEMO_SDL_MODE NEMO_SPORTSCORE_ENABLED NEMO_TEST_MEMORY_ONLY DATABASE_URL REDIS_URL SPORTRADAR_KEY SPORTMONKS_TOKEN SPORTMONKS_API_TOKEN API_FOOTBALL_KEY THESPORTSDB_KEY THESPORTSDB_API_KEY FOOTBALL_DATA_API_KEY NEMO_NEWS_DISABLE NEMO_DEBUG VERCEL_URL NEXT_PUBLIC_DEMO_CONTENT NEXT_PUBLIC_SITE_URL CRON_SECRET ADMIN_ACCESS_TOKEN; do
            if [ -n "${!v:-}" ]; then echo "::notice title=diag::$v=set"; else echo "::notice title=diag::$v=unset"; fi
          done

      # The server and the smoke test run in ONE step. A server started in one
      # step is not reliably alive in a later step, and the readiness loop must
      # not exit the step early (it used to call `exit 0`).
      - name: Smoke against a production server (empty-data mode, no secrets)
        env:
          BASE: http://127.0.0.1:3000
          # Pin the empty-data configuration. The keyless SportScore provider is
          # enabled by default and would make real outbound calls on a runner
          # with internet access, changing the responses smoke asserts on.
          NEMO_SPORTSCORE_ENABLED: "0"
        run: |
          # setsid gives the server its own process group, so the whole tree can be stopped.
          setsid npm run start > "$RUNNER_TEMP/server.log" 2>&1 &
          SERVER_PID=$!
          ready=0
          for i in $(seq 1 90); do
            if curl -fsS -o /dev/null "$BASE/"; then ready=1; echo "server up after ${i}s"; break; fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            echo "server did not start"; cat "$RUNNER_TEMP/server.log"; kill -- -"$SERVER_PID" 2>/dev/null || true; exit 1
          fi
          set +e
          npm run smoke > "$RUNNER_TEMP/smoke.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/smoke.log"
          if [ "$rc" != "0" ]; then
            # Failing lines and the server tail as annotations (readable via the API).
            grep -E "✗|Error|error" "$RUNNER_TEMP/smoke.log" | head -12 | while IFS= read -r l; do echo "::error title=smoke::$(printf '%s' "$l" | cut -c1-400)"; done
            tail -8 "$RUNNER_TEMP/smoke.log" | while IFS= read -r l; do echo "::warning title=smoke-tail::$(printf '%s' "$l" | cut -c1-400)"; done
            tail -12 "$RUNNER_TEMP/server.log" | while IFS= read -r l; do echo "::warning title=server-tail::$(printf '%s' "$l" | cut -c1-400)"; done
          fi
          kill -- -"$SERVER_PID" 2>/dev/null || true
          exit $rc

      - name: Server log on failure
        if: failure()
        run: cat "$RUNNER_TEMP/server.log" || true
