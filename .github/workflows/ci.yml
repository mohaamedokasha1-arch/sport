# NEMO Sports — CI (verification only).
# Runs the offline test suites, the production build, and the HTTP smoke test
# against a local production server. It uses NO secrets, makes NO deployment,
# and never touches a database or a live data provider.
name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · tests · build · smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: nemo-sports
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: nemo-sports/package-lock.json

      - name: Install (lockfile)
        run: npm ci

      - name: Check (typecheck + offline suites, no server, no network)
        run: npm run check

      - name: Build
        run: npm run build

      # The server and the smoke test run in ONE step. A server started in one
      # step is not reliably alive in a later step, and the readiness loop must
      # not exit the step early (it used to call `exit 0`).
      - name: Smoke against a production server (empty-data mode, no secrets)
        env:
          BASE: http://127.0.0.1:3000
        run: |
          # setsid gives the server its own process group, so the whole tree can be stopped.
          setsid npm run start > "$RUNNER_TEMP/server.log" 2>&1 &
          SERVER_PID=$!
          ready=0
          for i in $(seq 1 90); do
            if curl -fsS -o /dev/null "$BASE/"; then ready=1; echo "server up after ${i}s"; break; fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            echo "server did not start"; cat "$RUNNER_TEMP/server.log"; kill -- -"$SERVER_PID" 2>/dev/null || true; exit 1
          fi
          set +e
          npm run smoke
          rc=$?
          set -e
          kill -- -"$SERVER_PID" 2>/dev/null || true
          exit $rc

      - name: Server log on failure
        if: failure()
        run: cat "$RUNNER_TEMP/server.log" || true
